ul.index-list a:hover { text-decoration: underline; }
ul.index-list .desc { display: block; color: #666; font-size: 0.9rem; margin-top: 4px; font-weight: 400; }
@media (prefers-color-scheme: dark) {
  body { background: #1a1a1a; color: #e8e8e8; }

  nav.doc-nav a { color: #6ea8ff; }
  nav.doc-nav .current { color: #aaa; }
  h2 { border-color: #444; }
  .subtitle, footer.doc-foot { color: #999; }
  .note { background: #33301f; border-color: #b8860b; color: #e0d0a0; }
  table.spec th { background: #2a2a2a; }
  table.spec th, table.spec td { border-color: #444; }
  ul.index-list li { border-color: #333; }

  ul.index-list .desc { color: #999; }
